<!DOCTYPE html>
<html>
<head>
    <title>Profil Saya - Lusyah</title>
    <!-- Menghubungkan file HTML dengan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kartu-profil">
        <!-- Memperbaiki tanda kutip yang hilang pada atribut alt -->
        <img src="foto-profil.jpg" alt="Foto profil saya">
        
        <!-- Memperbaiki penulisan tag h1 yang sebelumnya keliru (<h1=...) -->
        <h1>Lusyah</h1>
        
        <p>Siswa SMA yang tertarik dengan teknologi dan desain. Selamat datang di website pertama saya!</p>
        
        <!-- Memperbaiki penulisan alamat URL Instagram -->
        <a href="https://www.instagram.com/usernameanda">Kunjungi Instagram Saya</a>
        
        <!-- Tombol interaktif yang akan dihubungkan dengan JavaScript -->
        <button id="sapaButton">Sapa Saya!</button>
    </div>

    <!-- Menghubungkan file HTML dengan file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
